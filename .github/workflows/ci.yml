name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # CI 显式声明为 test：允许 mock 短信 + 固定验证码，但日志不打印验证码
      APP_ENV: test
      # 全部指向本地 PGlite，CI 不需要外部数据库
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SMS_PROVIDER: mock
      OTP_ALLOW_FIXED_CODE: "true"
      OTP_MOCK_CODE: "123456"
      ALLOW_ADMIN_LOGIN: "true"
      ADMIN_LOGIN_PASSWORD: "123456"
      PRIVACY_PASSWORD: "331633"
      ALLOW_LAN_ACCESS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试 + 服务层测试（PGlite）
        run: npm test

      - name: 生产构建（严格，无测试标记）
        env:
          # NEXT_PUBLIC_* 在构建期被内联进产物，运行时注入无效。
          # 这一步要产出「生产身份」的产物，必须用 https 站点地址构建；
          # 否则下一步 prod-guard 的 C 用例会被配置自检正确地拒绝。
          # 后面的 build:test 仍用 job 级的 localhost 地址（APP_ENV=test，不校验 https）。
          NEXT_PUBLIC_APP_URL: https://giftdeal.example.com
        run: npm run build

      - name: 反向校验：生产构建必须拒绝 APP_ENV=test
        run: npm run check:prod-guard

      - name: 测试构建（冒烟 / E2E 专用，带测试标记）
        run: npm run build:test

      - name: 接口冒烟（起 PGlite + 测试构建服务）
        run: |
          set -e

          npm run db:local &
          DB_PID=$!
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null; then break; fi
            sleep 1
          done

          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          npx prisma db seed

          npm run start &
          APP_PID=$!
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then break; fi
            sleep 1
          done

          npm run smoke

          kill $APP_PID $DB_PID 2>/dev/null || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: test
      # 构建期需要数据库连接串（模块加载会校验存在性，但不会真正连接）
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55440/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:55440/postgres
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SMS_PROVIDER: mock
      OTP_ALLOW_FIXED_CODE: "true"
      OTP_MOCK_CODE: "123456"
      PRIVACY_PASSWORD: "331633"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E（测试构建 + 独立 PGlite + 独立端口）
        run: npm run test:e2e

      - name: 失败时上传报告与截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
